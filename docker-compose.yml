services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_ai}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:3001}
        VITE_NEXUS_API_URL: ${VITE_NEXUS_API_URL:-}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
        VITE_PRYMEIRA_ACCOUNT_API_URL: ${VITE_PRYMEIRA_ACCOUNT_API_URL:-}
        VITE_PRYMEIRA_HUB_URL: ${VITE_PRYMEIRA_HUB_URL:-https://app.prymeiradigital.com.br}
        VITE_PRYMEIRA_PRODUCT_KEY: ${VITE_PRYMEIRA_PRODUCT_KEY:-ads}
        VITE_PRYMEIRA_AUTH_ENABLED: ${VITE_PRYMEIRA_AUTH_ENABLED:-true}
        VITE_FACEBOOK_APP_ID: ${VITE_FACEBOOK_APP_ID:-}
        VITE_FACEBOOK_REDIRECT_URI: ${VITE_FACEBOOK_REDIRECT_URI:-}
        VITE_N8N_WEBHOOK_URL: ${VITE_N8N_WEBHOOK_URL:-}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_DEV_BYPASS: ${VITE_DEV_BYPASS:-false}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-nexus_ai}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
